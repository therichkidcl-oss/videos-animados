<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<link rel="stylesheet" href="base/tema.css" />
<link rel="stylesheet" href="base/papel.css" />
<script src="base/vendor/gsap.min.js"></script>
<script src="base/vendor/rough.js"></script>
<script src="tiempos.js"></script>
<script src="base/escena.js"></script>
<script src="base/papel.js"></script>
<style>
  #cab { position: absolute; left: 120px; top: 58px; }
  #cab .p-eyebrow { display: block; margin-bottom: 12px; }
  #cab h2 { font-size: 108px; white-space: nowrap; }
  #cab .t1 { display: inline-block; }

  /* reloj de papel sobre la hoja negra */
  #reloj { position: absolute; left: 112px; top: 330px; width: 560px; height: 660px; }
  #reloj .hierve { position: absolute; inset: 0; }
  #reloj svg { position: absolute; left: 0; top: 0; width: 560px; height: 560px; overflow: visible; }
  #reloj .cuenta { position: absolute; left: 0; top: 520px; width: 560px; height: 120px; }
  #reloj .cuenta span { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--marcador); font-size: 108px; color: var(--lima); }

  /* tarifas */
  .tag-tarifa { position: absolute; width: 440px; height: 204px; }
  .tag-tarifa .dentro { padding: 22px 32px 0; }
  .tag-tarifa .p-eyebrow { color: var(--tinta); font-size: 22px; opacity: 0.8; }
  .tag-tarifa .valor { display: inline-block; font-family: var(--marcador); font-size: 60px; margin-top: 10px; }
  .tag-tarifa .por { display: block; width: fit-content; font-family: var(--mano); font-weight: 700; font-size: 44px; margin-top: 2px; }
  .tag-tarifa .cinta { top: -22px; left: 150px; rotate: -5deg; }
  #tWeb { left: 778px; top: 232px; rotate: -2.5deg; --c: var(--lima); }
  #tApi { left: 1262px; top: 246px; rotate: 2deg; --c: var(--naranja); }

  /* hoja de cuaderno */
  #libreta { position: absolute; left: 760px; top: 470px; width: 940px; height: 540px; rotate: -1.2deg; }
  #libreta .p-corte {
    background:
      linear-gradient(to right, transparent 46px, rgba(222, 74, 62, 0.45) 46px 49px, transparent 49px),
      repeating-linear-gradient(to bottom, transparent 0 103px, rgba(66, 120, 205, 0.28) 103px 105px),
      var(--blanco);
    background-position: 0 0, 0 92px, 0 0;
  }
  #libreta svg { position: absolute; left: 0; top: 0; width: 940px; height: 540px; overflow: visible; }
  #libSub { mix-blend-mode: multiply; }
  #libreta .enc { position: absolute; top: 30px; font-family: var(--marcador); font-size: 34px; color: var(--tinta-suave); }
  #libreta .fila { position: absolute; left: 0; width: 940px; height: 100px; }
  #libreta .fila > * { position: absolute; display: inline-block; white-space: nowrap; }
  #libreta .seg { left: 76px; top: 4px; font-family: var(--marcador); font-size: 62px; }
  #libreta .web { left: 262px; top: 14px; font-family: var(--marcador); font-size: 50px; }
  #libreta .api { left: 668px; top: 14px; font-family: var(--marcador); font-size: 50px; }
  .p-marca { right: 34px; }
</style>
</head>
<body>
<div id="root" data-composition-id="03-genjutsu" data-start="0" data-width="1920" data-height="1080" data-duration="28.79">
  <audio id="voz" src="voz.wav" data-start="0.4" data-duration="27.69" data-volume="1"></audio>
  <div class="p-fondo"></div>
  <div class="p-escena">
    <div class="p-hoja recorte p-sombra con-borde" style="left:-160px; top:296px; width:940px; height:900px; rotate:-3deg; --c: var(--negro)"><div class="p-corte" data-amp="9"></div></div>
    <div class="p-hoja recorte p-sombra con-borde" style="left:1430px; top:-80px; width:600px; height:196px; rotate:4deg; --c: var(--lima)"><div class="p-corte" data-amp="8"></div></div>
    <div class="p-hoja recorte p-sombra baja" style="left:1560px; top:930px; width:440px; height:220px; rotate:-6deg; --c: var(--kraft)"><div class="p-corte" data-amp="6"></div></div>

    <div id="cab">
      <span class="p-eyebrow">Cuánto cuesta cada video</span>
      <h2 class="p-titulo"><span class="t1">Genjutsu</span> <span class="tira" style="--c: var(--lima)"><span class="p-corte" data-amp="3"></span>720p</span></h2>
    </div>

    <div id="reloj">
      <div class="hierve">
        <svg id="svgReloj" viewBox="0 0 560 560">
          <defs><pattern id="granoR" patternUnits="userSpaceOnUse" width="384" height="384"><image href="base/papel/grano.png" width="384" height="384" /></pattern></defs>
          <circle cx="280" cy="300" r="190" fill="#fbf9f4" />
          <circle cx="280" cy="300" r="190" fill="url(#granoR)" style="mix-blend-mode: multiply" />
          <circle id="arco" cx="280" cy="300" r="138" fill="none" stroke="#d1fe17" stroke-width="48" transform="rotate(-90 280 300)" />
          <g id="aguja"><line x1="280" y1="300" x2="280" y2="182" stroke="#1c1b18" stroke-width="12" stroke-linecap="round" /><circle cx="280" cy="300" r="16" fill="#1c1b18" /></g>
        </svg>
        <div class="cuenta"><span id="c0">5 s</span><span id="c1">10 s</span><span id="c2">15 s</span><span id="c3">30 s</span></div>
      </div>
    </div>

    <div id="tWeb" class="tag-tarifa recorte p-sombra con-borde"><div class="p-corte" data-amp="4"></div>
      <div class="dentro"><div class="p-eyebrow">En la web · plan</div><span class="valor">7 créditos</span><span class="por">por segundo</span></div>
      <div class="cinta"></div>
    </div>
    <div id="tApi" class="tag-tarifa recorte p-sombra con-borde"><div class="p-corte" data-amp="4"></div>
      <div class="dentro"><div class="p-eyebrow">En la API</div><span class="valor">US$ 0,68</span><span class="por">por segundo</span></div>
      <div class="cinta"></div>
    </div>

    <div id="libreta" class="recorte p-sombra"><div class="p-corte" data-amp="9" data-lados="t" data-paso="7"></div>
      <svg id="libSub" viewBox="0 0 940 540"></svg>
      <div class="enc" style="left: 76px">video</div>
      <div class="enc" style="left: 262px">en la web</div>
      <div class="enc" style="left: 668px">en la API</div>
      <div class="fila" id="f0" style="top: 108px"><span class="seg">5 s</span><span class="web">35 créditos</span><span class="api">US$ 3,41</span></div>
      <div class="fila" id="f1" style="top: 213px"><span class="seg">10 s</span><span class="web">70 créditos</span><span class="api">US$ 6,81</span></div>
      <div class="fila" id="f2" style="top: 318px"><span class="seg">15 s</span><span class="web">105 créditos</span><span class="api">US$ 10,22</span></div>
      <div class="fila" id="f3" style="top: 423px"><span class="seg">30 s</span><span class="web">210 créditos</span><span class="api">US$ 20,43</span></div>
      <svg id="libSobre" viewBox="0 0 940 540"></svg>
    </div>

    <div class="p-marca"><img src="base/logo-iahub-marca.png" alt="" /></div>
  </div>
  <div class="p-cortina recorte con-borde"><div class="p-corte" data-amp="16" data-lados="lr" data-paso="14"></div></div>
</div>

<script>
  papel.preparar();
  const tl = gsap.timeline({ paused: true });
  papel.cortina(tl);
  papel.ambiente(tl);

  // ---- titulo
  papel.escribir(tl, '#cab .p-eyebrow', T('intro', -0.15), 0.6);
  papel.deslizar(tl, '#cab .t1', T('intro', 0.05), { x: -160, giro: -5 });
  papel.pop(tl, '#cab .tira', TW('intro', '720p', 1, -0.2), { giro: 10 });

  // ---- reloj: cae, se dibuja su borde y tiembla como animacion a mano
  const sR = document.getElementById('svgReloj');
  const tinta = '#1c1b18', crema = '#fbf9f4';
  const borde = papel.trazo('elipse', [280, 300, 380, 380], { en: sR, grosor: 7, color: tinta, seed: 3 });
  const anillo = papel.trazo('elipse', [280, 300, 228, 228], { en: sR, grosor: 3, color: tinta, seed: 5 });
  const corona = [
    papel.trazo('rect', [250, 82, 60, 30], { en: sR, grosor: 5, color: tinta, relleno: crema, estiloRelleno: 'solid', seed: 8 }),
    papel.trazo('rect', [226, 56, 108, 28], { en: sR, grosor: 5, color: tinta, relleno: crema, estiloRelleno: 'solid', seed: 9 }),
    papel.trazo('linea', [418, 160, 446, 132], { en: sR, grosor: 9, color: crema, seed: 10 }),
  ];
  const marcas = [];
  for (let k = 0; k < 6; k++) {
    const a = (k * 60 - 90) * Math.PI / 180;
    marcas.push(papel.trazo('linea', [280 + Math.cos(a) * 166, 300 + Math.sin(a) * 166, 280 + Math.cos(a) * 184, 300 + Math.sin(a) * 184], { en: sR, grosor: 6, color: tinta, seed: 20 + k }));
  }
  sR.appendChild(document.getElementById('aguja')); // la aguja queda encima de los trazos
  const C = 2 * Math.PI * 138;
  gsap.set('#arco', { strokeDasharray: C, strokeDashoffset: C });

  papel.soltar(tl, '#reloj', T('intro', 0.45), { giro: -12 });
  papel.dibujar(tl, borde, T('intro', 0.7), 0.8);
  papel.dibujar(tl, [anillo].concat(corona), T('intro', 1.25), 0.6);
  papel.dibujar(tl, marcas, T('intro', 1.6), 0.5);
  tl.fromTo('#aguja', { opacity: 0 }, { opacity: 1, duration: 0.2 }, T('intro', 1.7));
  papel.hervir(tl, '#reloj .hierve', 0, DUR(), { amp: 1.1, giro: 0.5, seed: 4 });

  // ---- tarifas
  papel.soltar(tl, '#tWeb', TW('tarifa', 'web', 1, -0.3), { giro: -7, final: 0 });
  papel.escribir(tl, '#tWeb .valor', TW('tarifa', 'siete', 1, -0.08), 0.45);
  papel.escribir(tl, '#tWeb .por', TW('tarifa', 'segundo', 1, -0.1), 0.4);
  papel.soltar(tl, '#tApi', TW('tarifa', 'api', 1, -0.3), { giro: 7, final: 0 });
  papel.escribir(tl, '#tApi .valor', TW('tarifa', 'sesenta', 1, -0.08), 0.5);
  papel.escribir(tl, '#tApi .por', TW('tarifa', 'segundo', 2, -0.1), 0.4);

  // ---- cuaderno: cada fila se escribe cuando la voz la dice
  const sub = document.getElementById('libSub'), sobre = document.getElementById('libSobre');
  papel.deslizar(tl, '#libreta', T('cinco', -0.75), { x: 380, giro: 6, dur: 0.75 });
  papel.escribir(tl, '#libreta .enc', T('cinco', -0.35), 0.45);
  const lineaEnc = papel.trazo('linea', [62, 96, 912, 92], { en: sobre, grosor: 4, color: tinta, seed: 41 });
  papel.dibujar(tl, lineaEnc, T('cinco', -0.15), 0.35);

  const filas = [
    { id: 'cinco', seg: 'cinco', web: 'treinta', api: 'tres', s: 5, lw: 290, la: 210 },
    { id: 'diez', seg: 'diez', web: 'setenta', api: 'seis', s: 10, lw: 290, la: 210 },
    { id: 'quince', seg: 'quince', web: 'ciento', api: 'diez', s: 15, lw: 320, la: 240 },
    { id: 'treinta', seg: 'treinta', web: 'doscientos', api: 'veinte', s: 30, lw: 320, la: 240 },
  ];
  filas.forEach((f, i) => {
    const y = 108 + i * 105 + 52;
    const hlWeb = papel.trazo('linea', [250, y + 4, 250 + f.lw, y - 2], { en: sub, grosor: 42, color: '#d1fe17', aspereza: 1.8, unTrazo: true, seed: 60 + i });
    const hlApi = papel.trazo('linea', [656, y - 1, 656 + f.la, y + 4], { en: sub, grosor: 42, color: '#ff9a4d', aspereza: 1.8, unTrazo: true, seed: 70 + i });
    const t = TW(f.id, f.seg, 1, -0.12);
    papel.escribir(tl, `#f${i} .seg`, t, 0.35);
    papel.dibujar(tl, hlWeb, TW(f.id, f.web, 1, -0.3), 0.32);
    papel.escribir(tl, `#f${i} .web`, TW(f.id, f.web, 1, -0.06), 0.5);
    papel.dibujar(tl, hlApi, TW(f.id, f.api, 1, -0.3), 0.28);
    papel.escribir(tl, `#f${i} .api`, TW(f.id, f.api, 1, -0.06), 0.45);
    // el reloj avanza a esos segundos
    tl.to('#aguja', { rotation: f.s / 30 * 360, svgOrigin: '280 300', duration: 0.75, ease: 'back.out(1.4)' }, t);
    tl.to('#arco', { strokeDashoffset: C * (1 - f.s / 30), duration: 0.75, ease: 'power2.out' }, t);
    if (i > 0) tl.to(`#c${i - 1}`, { opacity: 0, y: -24, duration: 0.18, ease: 'power2.in' }, t - 0.05);
    papel.pop(tl, `#c${i}`, t + 0.05, { giro: -8 });
  });
  // "el maximo": circulo rojo a mano alrededor de 30 s
  const circulo = papel.trazo('elipse', [140, 108 + 3 * 105 + 46, 220, 104], { en: sobre, grosor: 5, color: '#f0402f', aspereza: 1.6, seed: 90 });
  papel.dibujar(tl, circulo, TW('treinta', 'maximo', 1, -0.15), 0.55);

  window.__timelines['03-genjutsu'] = tl;
</script>
</body>
</html>
